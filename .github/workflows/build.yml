on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        reqstool-source: [pypi, main]
    steps:
      - name: Check out source repository
        uses: actions/checkout@v7.0.1
      - name: Set up Java
        uses: actions/setup-java@v6.1.0
        with:
          java-version: "21.0.12+8.0.LTS"
          distribution: "temurin"
      - name: Build project
        run: mvn clean verify
      - name: Install reqstool
        uses: reqstool/.github/.github/actions/install-reqstool@47ea2f814efd0a4dd02bce2d9fd9d97725945cf6 # 1.2.0
        with:
          reqstool-source: ${{ matrix.reqstool-source }}
      - name: Validate reqstool spec completeness
        # not yet available in the latest PyPI release
        if: matrix.reqstool-source == 'main'
        uses: reqstool/.github/.github/actions/validate-reqstool@47ea2f814efd0a4dd02bce2d9fd9d97725945cf6 # 1.2.0
      - name: Run reqstool status
        uses: reqstool/.github/.github/actions/reqstool-status@47ea2f814efd0a4dd02bce2d9fd9d97725945cf6 # 1.2.0
        with:
          # this repo intentionally has incomplete requirements (it showcases every status outcome)
          fail-if-incomplete: "false"

  validate-openspec:
    uses: reqstool/.github/.github/workflows/common-validate-openspec.yml@47ea2f814efd0a4dd02bce2d9fd9d97725945cf6 # 1.2.0
