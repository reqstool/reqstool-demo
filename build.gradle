plugins {
    id 'java'
    id 'io.github.reqstool.gradle-plugin' version '1.0.0'
}

group = 'io.github.reqstool'
version = '0.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    // Reqstool annotations
    implementation 'io.github.reqstool:reqstool-java-annotations:1.0.1'
    annotationProcessor 'io.github.reqstool:reqstool-java-annotations:1.0.1'
    
    // Test dependencies
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testAnnotationProcessor 'io.github.reqstool:reqstool-java-annotations:1.0.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    // Ignore test failures (matching Maven behavior)
    ignoreFailures = true
}

requirementsTool {
    datasetPath = file('docs/reqstool')
    testResults = ['build/test-results/**/*.xml']
}
